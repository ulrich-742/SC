services:
  web:
    build:
      context: .
      target: build
    working_dir: /app
    command: npm run dev
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
      - "3310:3310"
    environment:
      APP_PORT: 3310
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-before-production}
      CLIENT_URL: http://localhost:3000
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: ${DB_USER:-secare}
      DB_PASSWORD: ${DB_PASSWORD:-secare_dev_password}
      DB_NAME: ${DB_NAME:-secare}
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-secare}
      MYSQL_USER: ${DB_USER:-secare}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secare_dev_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secare_root_dev_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  mysql_data:
  node_modules:
